name: Report a problem
description: Report an extension issue without exposing private account data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For a live trading problem, check native Positions and Status first. Public reports must not contain private keys, seed phrases, wallet addresses, balances, or unredacted account screenshots. Review exports before sharing."
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in the queue footer.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome on macOS
  - type: textarea
    id: steps
    attributes:
      label: What did you click, and what happened?
      description: Include the visible status/error text after removing identifying information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I checked this report for private keys, seed phrases, wallet addresses and sensitive account details.
          required: true
